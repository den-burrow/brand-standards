version: 2
updates:
  # JavaScript / npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 stops ROUTINE version-update pull requests. Dependabot SECURITY
    # updates are a separate product and still open. Enabled on this
    # repository on 2026-08-17 — alerts and security updates were both OFF
    # until then, so the security half was not running at all.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
